name: Verify

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-ml.txt
            services/simulation/requirements*.txt
      - run: python -m pip install torch==2.13.0 --index-url https://download.pytorch.org/whl/cpu
        working-directory: .
      - run: python -m pip install -r requirements-ml.txt
        working-directory: .
      - run: python -m pytest tests -q
        working-directory: .
      - run: python -m ruff check ml scripts services/simulation tests
        working-directory: .
      - run: python -m services.simulation.fixtures --check
        working-directory: .
      - run: python -m scripts.generate_contracts --check
        working-directory: .
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npx playwright install --with-deps chromium
      - run: npm run test:smoke
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-diagnostics
          path: apps/web/test-results/
          retention-days: 7

  reference-physics:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: reference/legacy-physics
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
