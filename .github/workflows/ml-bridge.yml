name: Official v1 ML bridge
on:
  pull_request:
    paths:
      - 'ml_bridge/**'
      - 'tests/ml_bridge/**'
      - 'tests/energydna/**'
      - 'research/**'
      - 'docs/ml/**'
      - 'docs/unified/**'
      - 'apps/web/**'
      - 'services/simulation/**'
      - '.github/workflows/ml-bridge.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ml-bridge-${{ github.ref }}
  cancel-in-progress: true
jobs:
  bridge:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            services/simulation/requirements-dev.lock
            ml_bridge/requirements.txt
      - name: Install unchanged official physics dependencies
        run: python -m pip install --require-hashes -r services/simulation/requirements-dev.lock
      - name: Check official engine, API and frozen fixtures
        run: python -m services.simulation.check
      - name: Verify physical bridge works before installing ML packages
        run: python -m pytest tests/ml_bridge/test_bridge.py -q
      - name: Install CPU neural research runtime
        run: python -m pip install torch==2.13.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r ml_bridge/requirements.txt
      - run: python -m ruff check ml_bridge tests/ml_bridge research/energydna tests/energydna
      - run: python -m ruff format --check ml_bridge tests/ml_bridge research/energydna tests/energydna
      - run: python -m ml_bridge.export_contract --check
      - run: python -m ml_bridge.export_unified --check
      - run: python -m pytest tests/ml_bridge -q
      - name: Verify EnergyDNA leakage boundaries, actual training and artifact reload
        run: python -m pytest tests/energydna -q
  unified-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: python -m pip install torch==2.13.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r ml_bridge/requirements.txt
      - run: npm ci
        working-directory: apps/web
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - name: Real browser to unified API and both trained checkpoints
        shell: bash
        env:
          CI: 'true'
          LASTLIGHT_LIVE_API: '1'
          LASTLIGHT_FALLBACK_API: http://127.0.0.1:8002
        run: |
          python -m uvicorn services.simulation.api:app --host 127.0.0.1 --port 8000 > unified-api.log 2>&1 &
          main_pid=$!
          LASTLIGHT_FRAGILITY_CHECKPOINT=/tmp/lastlight-no-checkpoint LASTLIGHT_ENERGYDNA_CHECKPOINT=/tmp/lastlight-no-checkpoint python -m uvicorn services.simulation.api:app --host 127.0.0.1 --port 8002 > fallback-api.log 2>&1 &
          fallback_pid=$!
          trap 'kill "$main_pid" "$fallback_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/health && curl -fsS http://127.0.0.1:8002/health; then break; fi
            sleep 1
          done
          cd apps/web
          npx playwright test tests/unified.spec.ts --workers=1
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: unified-browser-diagnostics
          path: |
            *-api.log
            apps/web/test-results/
