name: Issue 04 — WebGL visual captures

on:
  pull_request:
    paths:
      - 'apps/web/src/scene/**'
      - 'apps/web/public/assets/materials/**'
      - 'apps/web/tests/issue04.visual.spec.ts'
      - '.github/workflows/issue04-visual-review.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture-school:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Capture actual school WebGL frames at locked shot IDs
        run: npx playwright test tests/issue04.visual.spec.ts
        env:
          CI: 'true'
          ISSUE04_CAPTURE: '1'
      - name: Upload WebGL captures (candidate / not yet visually approved)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue04-real-webgl-review
          path: apps/web/artifacts/issue04/
          if-no-files-found: warn
          retention-days: 30
